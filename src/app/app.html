<header class="navbar border-b border-base-300 bg-base-100 px-4 sm:px-6">
  <div class="flex-1">
    <a href="/" class="text-lg font-semibold tracking-tight text-base-content">Charchive</a>
  </div>
  <div class="flex-none">
    @if (isLoggedIn()) {
      <div class="flex items-center gap-2">
        <button type="button" class="btn btn-ghost btn-sm sm:btn-md" (click)="navigateTo('/')">
          Browse cards
        </button>
        <button
          type="button"
          class="btn btn-outline btn-sm sm:btn-md"
          (click)="navigateTo('/my/cards')"
        >
          My cards
        </button>
        <button
          type="button"
          class="btn btn-primary btn-sm sm:btn-md"
          (click)="navigateTo('/my/account')"
        >
          Account
        </button>
        <button type="button" class="btn btn-ghost btn-sm sm:btn-md" (click)="signOut()">
          Sign out
        </button>
      </div>
    } @else {
      <button type="button" class="btn btn-primary btn-sm sm:btn-md" (click)="navigateTo('/login')">
        Login
      </button>
    }
  </div>
</header>

<main class="min-h-[calc(100vh-4rem)]">
  <router-outlet />
</main>
