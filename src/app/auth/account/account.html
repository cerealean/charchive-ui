<section class="min-h-screen bg-base-200 px-4 py-8 sm:px-6 lg:px-8">
  <div class="mx-auto flex w-full max-w-5xl flex-col gap-6">
    <header class="rounded-3xl bg-neutral px-6 py-8 text-neutral-content shadow-xl sm:px-8">
      <p class="text-xs font-semibold uppercase tracking-[0.2em] text-neutral-content/75">
        Account
      </p>
      <h1 class="mt-3 text-3xl font-black tracking-tight sm:text-4xl">Manage your profile</h1>
      <p class="mt-3 max-w-2xl text-sm leading-6 text-neutral-content/75 sm:text-base">
        Update your public details and avatar so your archive activity stays recognizable.
      </p>
    </header>

    <div class="card border border-base-300 bg-base-100 shadow-xl">
      <div class="card-body gap-6 p-6 sm:p-8">
        <div aria-live="polite" class="space-y-3">
          @if (statusMessage) {
            <div role="status" class="alert alert-success alert-soft">
              <span>{{ statusMessage }}</span>
            </div>
          }

          @if (errorMessage) {
            <div role="alert" class="alert alert-error alert-soft">
              <span>{{ errorMessage }}</span>
            </div>
          }
        </div>

        <form
          [formGroup]="updateProfileForm"
          (ngSubmit)="updateProfile()"
          class="space-y-6"
          novalidate
        >
          <div class="rounded-2xl border border-base-300 bg-base-200/60 p-4 sm:p-5">
            <app-avatar [avatarUrl]="avatarUrl" (upload)="updateAvatar($event)"></app-avatar>
          </div>

          <div class="grid gap-5 md:grid-cols-2">
            <label class="form-control w-full md:col-span-2">
              <div class="label px-0 pb-2">
                <span class="label-text font-medium text-base-content">Email</span>
              </div>
              <input
                id="email"
                class="input input-bordered w-full"
                type="email"
                [value]="user?.email ?? ''"
                readonly
                aria-readonly="true"
              />
              <div class="label px-0 pt-2">
                <span class="label-text-alt text-base-content/60"
                  >Email is managed by your auth provider.</span
                >
              </div>
            </label>

            <label class="form-control w-full">
              <div class="label px-0 pb-2">
                <span class="label-text font-medium text-base-content">Display name</span>
              </div>
              <input
                id="username"
                formControlName="username"
                class="input input-bordered w-full"
                type="text"
                placeholder="How should people see your name?"
                autocomplete="name"
                maxlength="64"
              />
            </label>

            <label class="form-control w-full">
              <div class="label px-0 pb-2">
                <span class="label-text font-medium text-base-content">Website</span>
              </div>
              <input
                id="website"
                formControlName="website"
                class="input input-bordered w-full"
                type="url"
                placeholder="https://example.com"
                autocomplete="url"
                [attr.aria-invalid]="websiteControl.invalid && websiteControl.touched"
              />
              @if (websiteControl.invalid && websiteControl.touched) {
                <div class="label px-0 pt-2">
                  <span class="label-text-alt text-error"
                    >Use a full URL starting with http:// or https://.</span
                  >
                </div>
              }
            </label>
          </div>

          <div class="flex flex-col gap-3 pt-2 sm:flex-row">
            <button type="submit" class="btn btn-primary" [disabled]="loading">
              @if (loading) {
                <span class="loading loading-spinner loading-sm" aria-hidden="true"></span>
                Saving...
              } @else {
                Save profile
              }
            </button>
            <button type="button" class="btn btn-outline" (click)="signOut()" [disabled]="loading">
              Sign out
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
