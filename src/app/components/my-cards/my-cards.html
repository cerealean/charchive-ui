<section class="min-h-screen bg-base-200 px-4 py-8 sm:px-6 lg:px-8">
  <div class="mx-auto flex w-full max-w-5xl flex-col gap-6">
    <header class="rounded-3xl bg-neutral px-6 py-8 text-neutral-content shadow-xl sm:px-8">
      <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
        <div>
          <p class="text-xs font-semibold uppercase tracking-[0.2em] text-neutral-content/75">
            Cards
          </p>
          <h1 class="mt-2 text-3xl font-black tracking-tight sm:text-4xl">My cards</h1>
          <p class="mt-2 text-sm text-neutral-content/75 sm:text-base">
            Skeleton list of cards you own. Data wiring to Supabase comes next.
          </p>
        </div>

        <label class="btn btn-primary">
          Upload new card
          <input
            type="file"
            class="sr-only"
            accept=".png,.json,application/json,image/png"
            (change)="handleUpload($event)"
          />
        </label>
      </div>
    </header>

    @if (uploadStatus()) {
      <div role="status" class="alert alert-info alert-soft">
        <span>{{ uploadStatus() }}</span>
      </div>
    }

    <div class="grid gap-4">
      @for (card of cards(); track card.id) {
        <article class="card border border-base-300 bg-base-100 shadow-sm">
          <div class="card-body gap-4 sm:flex-row sm:items-center sm:justify-between">
            <div class="space-y-1">
              <h2 class="text-xl font-semibold text-base-content">{{ card.title }}</h2>
              <div class="flex flex-wrap items-center gap-2 text-sm text-base-content/70">
                <span class="badge badge-outline">{{ card.visibility }}</span>
                <span>Updated {{ card.updatedAt }}</span>
              </div>
            </div>

            <button type="button" class="btn btn-outline" (click)="viewCard(card.id)">
              Open card
            </button>
          </div>
        </article>
      }
    </div>
  </div>
</section>
