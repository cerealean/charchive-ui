<section class="min-h-screen bg-base-200 px-4 py-8 sm:px-6 lg:px-8">
  <div class="mx-auto flex w-full max-w-4xl flex-col gap-6">
    <button type="button" class="btn btn-ghost w-fit" (click)="backToMyCards()">
      Back to my cards
    </button>

    <article class="card border border-base-300 bg-base-100 shadow-xl">
      <div class="card-body gap-5 p-6 sm:p-8">
        <header class="space-y-2">
          <p class="text-xs font-semibold uppercase tracking-[0.2em] text-base-content/60">Card</p>
          <h1 class="text-3xl font-black tracking-tight text-base-content sm:text-4xl">
            Card {{ cardId() || '(missing id)' }}
          </h1>
          <p class="text-sm text-base-content/70 sm:text-base">
            Skeleton card detail view. This page will render real card fields in the next step.
          </p>
        </header>

        <div class="grid gap-4 sm:grid-cols-2">
          <div class="rounded-2xl border border-base-300 bg-base-200/70 p-4">
            <h2 class="text-sm font-semibold uppercase tracking-wide text-base-content/70">
              Visibility
            </h2>
            <p class="mt-2 text-lg font-medium text-base-content">-</p>
          </div>

          <div class="rounded-2xl border border-base-300 bg-base-200/70 p-4">
            <h2 class="text-sm font-semibold uppercase tracking-wide text-base-content/70">
              Rating
            </h2>
            <p class="mt-2 text-lg font-medium text-base-content">-</p>
          </div>

          <div class="rounded-2xl border border-base-300 bg-base-200/70 p-4 sm:col-span-2">
            <h2 class="text-sm font-semibold uppercase tracking-wide text-base-content/70">
              Summary
            </h2>
            <p class="mt-2 text-base-content/70">Card summary placeholder.</p>
          </div>
        </div>
      </div>
    </article>
  </div>
</section>
