<dialog #dialog class="modal" aria-labelledby="change-password-title">
  <div class="modal-box">
    <h3 id="change-password-title" class="text-lg font-bold text-base-content">
      @if (hasPassword()) {
        Update password
      } @else {
        Create password
      }
    </h3>
    <p class="mt-1 text-sm text-base-content/70">
      @if (hasPassword()) {
        Enter your current password, then choose a new one.
      } @else {
        Add a password so you can sign in without a magic link.
      }
    </p>

    @if (errorMessage()) {
      <div role="alert" class="alert alert-error alert-soft mt-4">
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <form (submit)="submit(); $event.preventDefault()" class="mt-4 flex flex-col gap-5" novalidate>
      @if (hasPassword()) {
        <label class="form-control w-full">
          <div class="label px-0 pb-2">
            <span class="label-text font-medium text-base-content">Current password</span>
          </div>
          <input
            id="current-password"
            [formField]="form.currentPassword"
            class="input input-bordered w-full"
            type="password"
            autocomplete="current-password"
            [attr.aria-invalid]="form.currentPassword().touched() && form.currentPassword().invalid()"
            [attr.aria-describedby]="
              form.currentPassword().touched() && form.currentPassword().invalid()
                ? 'current-password-error'
                : null
            "
          />
          @if (form.currentPassword().touched() && form.currentPassword().errors().length) {
            <div class="label px-0 pt-2">
              <span id="current-password-error" class="label-text-alt text-error">
                {{ form.currentPassword().errors()[0].message }}
              </span>
            </div>
          }
        </label>
      }

      <label class="form-control w-full">
        <div class="label px-0 pb-2">
          <span class="label-text font-medium text-base-content">New password</span>
        </div>
        <input
          id="modal-new-password"
          [formField]="form.password"
          class="input input-bordered w-full"
          type="password"
          autocomplete="new-password"
          [attr.aria-invalid]="form.password().touched() && form.password().invalid()"
          aria-describedby="password-requirements"
        />
        <ul id="password-requirements" class="mt-3 grid gap-1 text-sm text-base-content">
          @for (req of requirements(); track req.label) {
            <li [class.text-success]="req.met" [class.opacity-60]="!req.met">
              <span aria-hidden="true">{{ req.met ? '✓' : '○' }}</span>
              {{ req.label }}
            </li>
          }
        </ul>
      </label>

      <label class="form-control w-full">
        <div class="label px-0 pb-2">
          <span class="label-text font-medium text-base-content">Confirm new password</span>
        </div>
        <input
          id="modal-confirm-password"
          [formField]="form.confirmPassword"
          class="input input-bordered w-full"
          type="password"
          autocomplete="new-password"
          [attr.aria-invalid]="form.confirmPassword().touched() && form.confirmPassword().invalid()"
          [attr.aria-describedby]="
            form.confirmPassword().touched() && form.confirmPassword().invalid()
              ? 'modal-confirm-error'
              : null
          "
        />
        @if (form.confirmPassword().touched() && form.confirmPassword().errors().length) {
          <div class="label px-0 pt-2">
            <span id="modal-confirm-error" class="label-text-alt text-error">
              {{ form.confirmPassword().errors()[0].message }}
            </span>
          </div>
        }
      </label>

      <div class="modal-action">
        <button type="button" class="btn btn-ghost" (click)="close()" [disabled]="loading()">
          Cancel
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="loading()">
          @if (loading()) {
            <span class="loading loading-spinner loading-sm" aria-hidden="true"></span>
            Saving...
          } @else if (hasPassword()) {
            Update password
          } @else {
            Create password
          }
        </button>
      </div>
    </form>
  </div>

  <form method="dialog" class="modal-backdrop">
    <button>close</button>
  </form>
</dialog>
