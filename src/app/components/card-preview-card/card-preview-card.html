<article class="card card-side h-full border border-base-300 bg-base-100 shadow-sm">
  <figure class="w-28 shrink-0 overflow-hidden bg-base-200 sm:w-32">
    @if (card().imageUrl) {
      <img
        [src]="card().imageUrl"
        alt="Card image for {{ card().name }}"
        class="h-full w-full object-cover"
      />
    } @else {
      <div
        class="grid h-full min-h-44 w-full place-items-center px-3 text-center text-xs font-semibold uppercase tracking-wide text-base-content/55"
      >
        No image
      </div>
    }
  </figure>

  <div class="card-body gap-3 p-4">
    <div class="space-y-1">
      <h2 class="line-clamp-2 text-lg font-bold leading-6 text-base-content">
        {{ card().name }}
      </h2>
      <p class="line-clamp-2 text-sm text-base-content/70">{{ card().tagline }}</p>
    </div>

    <div class="flex flex-wrap gap-1.5">
      @if (card().tags.length > 0) {
        @for (tag of card().tags.slice(0, 4); track tag.slug) {
          <span class="badge badge-outline badge-sm">{{ tag.name }}</span>
        }
      } @else {
        <span class="badge badge-ghost badge-sm">Untagged</span>
      }
    </div>

    <div class="mt-auto space-y-2 pt-1">
      <p class="text-xs text-base-content/70">
        Uploaded by <span class="font-semibold">{{ card().uploader }}</span>
      </p>
      <p class="flex items-center gap-2 text-xs text-base-content/60">
        <span>{{ card().createdAgo }}</span>
        <span aria-hidden="true">·</span>
        <span class="inline-flex items-center gap-1">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            class="size-3.5"
            aria-hidden="true"
          >
            <path
              d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 01-.383-.218 25.18 25.18 0 01-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0112 5.052 5.5 5.5 0 0116.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 01-4.244 3.17 15.247 15.247 0 01-.383.219l-.022.012-.007.004-.003.001a.752.752 0 01-.704 0l-.003-.001z"
            />
          </svg>
          <span>{{ card().likeCount }}</span>
          <span class="sr-only">likes</span>
        </span>
      </p>
      <button type="button" class="btn btn-outline btn-sm w-full" (click)="onViewCard()">
        View card
      </button>
    </div>
  </div>
</article>
