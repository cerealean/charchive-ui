<div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
  <div class="flex items-center gap-4">
    <div class="avatar">
      <div
        class="w-28 rounded-2xl bg-base-300 ring ring-base-300 ring-offset-2 ring-offset-base-100 sm:w-32"
      >
        @if (imageUrl()) {
          <img [src]="imageUrl()" alt="Profile avatar" />
        } @else {
          <div
            class="grid h-full w-full place-items-center text-xs font-semibold uppercase tracking-wider text-base-content/60"
          >
            No image
          </div>
        }
      </div>
    </div>

    <div class="space-y-1">
      <p class="text-sm font-semibold text-base-content">Profile photo</p>
      <p class="text-xs leading-5 text-base-content/65">
        PNG, JPG, or WebP. Recommended: square image.
      </p>
    </div>
  </div>

  <div class="flex flex-col items-start gap-2 sm:items-end">
    <label class="btn btn-secondary btn-sm" [for]="fileInputId">
      @if (uploading()) {
        <span class="loading loading-spinner loading-xs" aria-hidden="true"></span>
        Uploading...
      } @else {
        Upload image
      }
    </label>
    <input
      class="hidden"
      type="file"
      [id]="fileInputId"
      accept="image/*"
      (change)="uploadAvatar($event)"
      [disabled]="uploading()"
    />
  </div>
</div>

@if (errorMessage()) {
  <div role="alert" class="alert alert-error alert-soft mt-3">
    <span>{{ errorMessage() }}</span>
  </div>
}
