name: Build and Deploy to DreamHost

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app (production)
        run: npm run build -- --configuration production

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: angular-production-build
          path: dist/charchive-ui/browser
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    env:
      DREAMHOST_SFTP_HOST: ${{ vars.DREAMHOST_SFTP_HOST }}
      DREAMHOST_SFTP_PORT: ${{ vars.DREAMHOST_SFTP_PORT }}
      DREAMHOST_SFTP_USER: ${{ vars.DREAMHOST_SFTP_USER }}
      DREAMHOST_DEPLOY_PATH: ${{ vars.DREAMHOST_DEPLOY_PATH }}
    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: angular-production-build
          path: ./build

      - name: Validate deployment configuration
        env:
          DREAMHOST_SFTP_PASSWORD: ${{ secrets.DREAMHOST_SFTP_PASSWORD }}
          DREAMHOST_SFTP_KNOWN_HOSTS: ${{ secrets.DREAMHOST_SFTP_KNOWN_HOSTS }}
        run: |
          test -n "$DREAMHOST_SFTP_PASSWORD" || { echo "Error: DREAMHOST_SFTP_PASSWORD is not set"; exit 1; }
          test -n "$DREAMHOST_SFTP_KNOWN_HOSTS" || { echo "Error: DREAMHOST_SFTP_KNOWN_HOSTS is not set"; exit 1; }
          test -n "$DREAMHOST_SFTP_HOST" || { echo "Error: DREAMHOST_SFTP_HOST is not set"; exit 1; }
          test -n "$DREAMHOST_SFTP_USER" || { echo "Error: DREAMHOST_SFTP_USER is not set"; exit 1; }
          test -n "$DREAMHOST_DEPLOY_PATH" || { echo "Error: DREAMHOST_DEPLOY_PATH is not set"; exit 1; }
          test -f "./build/index.html" || { echo "Error: build artifact is missing index.html"; exit 1; }
          echo "SFTP_PORT=${DREAMHOST_SFTP_PORT:-22}" >> "$GITHUB_ENV"

      - name: Install SFTP client
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Set up known hosts
        env:
          DREAMHOST_SFTP_KNOWN_HOSTS: ${{ secrets.DREAMHOST_SFTP_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DREAMHOST_SFTP_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy via SFTP
        env:
          DREAMHOST_SFTP_PASSWORD: ${{ secrets.DREAMHOST_SFTP_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          DRYRUN_CMD_FILE="$(mktemp)"
          DEPLOY_CMD_FILE="$(mktemp)"
          DRYRUN_LOG_FILE="$(mktemp)"
          trap 'rm -f "$DRYRUN_CMD_FILE" "$DEPLOY_CMD_FILE" "$DRYRUN_LOG_FILE"' EXIT
          LFTP_CONNECT='set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts"'
          run_lftp_mirror() {
            local dry_run_flag="$1"
            local command_file="$2"
            cat > "$command_file" <<EOF
          set cmd:fail-exit true
          $LFTP_CONNECT
          open sftp://$DREAMHOST_SFTP_HOST:$SFTP_PORT
          user "$DREAMHOST_SFTP_USER" "$DREAMHOST_SFTP_PASSWORD"
          mirror --reverse --verbose --delete $dry_run_flag ./build "$DREAMHOST_DEPLOY_PATH"
          bye
          EOF
            chmod 600 "$command_file"
            lftp -f "$command_file"
          }

          echo "Running deployment dry-run over SFTP..."
          run_lftp_mirror "--dry-run" "$DRYRUN_CMD_FILE" > "$DRYRUN_LOG_FILE" || {
            echo "Error: dry-run deployment failed (check DREAMHOST_SFTP_KNOWN_HOSTS for host-key mismatches)"
            exit 1
          }
          {
            echo "### Deployment dry-run"
            echo '```'
            cat "$DRYRUN_LOG_FILE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Applying deployment..."
          run_lftp_mirror "" "$DEPLOY_CMD_FILE" || { echo "Error: deployment failed"; exit 1; }

      - name: Clean up host verification data
        if: always()
        run: |
          rm -f ~/.ssh/known_hosts
