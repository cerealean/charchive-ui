name: Build and Deploy to DreamHost

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app (production)
        run: npm run build -- --configuration production

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: angular-production-build
          path: dist/charchive-ui/browser
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    env:
      DREAMHOST_SFTP_HOST: ${{ vars.DREAMHOST_SFTP_HOST }}
      DREAMHOST_SFTP_PORT: ${{ vars.DREAMHOST_SFTP_PORT }}
      DREAMHOST_SFTP_USER: ${{ vars.DREAMHOST_SFTP_USER }}
      DREAMHOST_DEPLOY_PATH: ${{ vars.DREAMHOST_DEPLOY_PATH }}
    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: angular-production-build
          path: ./build

      - name: Validate deployment configuration
        env:
          DREAMHOST_SFTP_PASSWORD: ${{ secrets.DREAMHOST_SFTP_PASSWORD }}
        run: |
          test -n "$DREAMHOST_SFTP_PASSWORD" || { echo "Error: DREAMHOST_SFTP_PASSWORD is not set"; exit 1; }
          test -n "$DREAMHOST_SFTP_HOST" || { echo "Error: DREAMHOST_SFTP_HOST is not set"; exit 1; }
          test -n "$DREAMHOST_SFTP_USER" || { echo "Error: DREAMHOST_SFTP_USER is not set"; exit 1; }
          test -n "$DREAMHOST_DEPLOY_PATH" || { echo "Error: DREAMHOST_DEPLOY_PATH is not set"; exit 1; }
          test -f "./build/index.html" || { echo "Error: build artifact is missing index.html"; exit 1; }

      - name: Dry-run SFTP deployment
        uses: Dylan700/sftp-upload-action@v1.2.3
        with:
          server: ${{ vars.DREAMHOST_SFTP_HOST }}
          username: ${{ vars.DREAMHOST_SFTP_USER }}
          password: ${{ secrets.DREAMHOST_SFTP_PASSWORD }}
          port: ${{ vars.DREAMHOST_SFTP_PORT }}
          uploads: |
            ./build/ => ${{ vars.DREAMHOST_DEPLOY_PATH }}/
          delete: true
          dry-run: true

      - name: Deploy via SFTP
        uses: Dylan700/sftp-upload-action@v1.2.3
        with:
          server: ${{ vars.DREAMHOST_SFTP_HOST }}
          username: ${{ vars.DREAMHOST_SFTP_USER }}
          password: ${{ secrets.DREAMHOST_SFTP_PASSWORD }}
          port: ${{ vars.DREAMHOST_SFTP_PORT }}
          uploads: |
            ./build/ => ${{ vars.DREAMHOST_DEPLOY_PATH }}/
          delete: true
