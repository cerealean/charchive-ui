name: Build and Deploy to DreamHost

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app (production)
        run: npm run build -- --configuration production

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: angular-production-build
          path: dist/charchive-ui/browser
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    env:
      DREAMHOST_SSH_HOST: ${{ vars.DREAMHOST_SSH_HOST }}
      DREAMHOST_SSH_PORT: ${{ vars.DREAMHOST_SSH_PORT }}
      DREAMHOST_SSH_USER: ${{ vars.DREAMHOST_SSH_USER }}
      DREAMHOST_DEPLOY_PATH: ${{ vars.DREAMHOST_DEPLOY_PATH }}
    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: angular-production-build
          path: ./build

      - name: Set up SSH key
        env:
          DREAMHOST_SSH_PRIVATE_KEY: ${{ secrets.DREAMHOST_SSH_PRIVATE_KEY }}
          DREAMHOST_KNOWN_HOSTS: ${{ secrets.DREAMHOST_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DREAMHOST_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DREAMHOST_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy via rsync over SSH
        run: |
          test -n "$DREAMHOST_SSH_HOST" || { echo "Error: DREAMHOST_SSH_HOST is not set"; exit 1; }
          test -n "$DREAMHOST_SSH_USER" || { echo "Error: DREAMHOST_SSH_USER is not set"; exit 1; }
          test -n "$DREAMHOST_DEPLOY_PATH" || { echo "Error: DREAMHOST_DEPLOY_PATH is not set"; exit 1; }
          SSH_PORT="${DREAMHOST_SSH_PORT:-22}"
          rsync -az \
            -e "ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT -o StrictHostKeyChecking=yes" \
            ./build/ \
            "$DREAMHOST_SSH_USER@$DREAMHOST_SSH_HOST:$DREAMHOST_DEPLOY_PATH"
