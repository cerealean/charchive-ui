name: Build and Deploy to DreamHost

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app (production)
        run: npm run build -- --configuration production

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: angular-production-build
          path: dist/charchive-ui/browser
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: angular-production-build
          path: ./build

      - name: Set up SSH key
        env:
          DREAMHOST_SSH_PRIVATE_KEY: ${{ secrets.DREAMHOST_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DREAMHOST_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ vars.DREAMHOST_SSH_PORT || 22 }}" "${{ vars.DREAMHOST_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy via rsync over SSH
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ vars.DREAMHOST_SSH_PORT || 22 }}" \
            ./build/ \
            "${{ vars.DREAMHOST_SSH_USER }}@${{ vars.DREAMHOST_SSH_HOST }}:${{ vars.DREAMHOST_DEPLOY_PATH }}"
